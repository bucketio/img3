<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="0.5" stop-color="#e0e7ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="puzzle1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a6bff" stop-opacity="0.2"/><stop offset="1" stop-color="#1a6bff" stop-opacity="0.08"/></linearGradient>
    <linearGradient id="puzzle2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b35" stop-opacity="0.2"/><stop offset="1" stop-color="#ff6b35" stop-opacity="0.08"/></linearGradient>
  </defs>
  
  <rect width="940" height="400" fill="url(#bg2)"/>
  
  <!-- Background grid dots -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#1a6bff"/>
    </pattern>
    <rect width="940" height="400" fill="url(#dots)"/>
  </g>
  
  <!-- Puzzle pieces scattered -->
  <g opacity="0.15">
    <!-- Top-right cluster -->
    <path d="M680,50 l70,0 l0,48 l-18,-6 l-17,6 l0,-18 l-35,0 z" fill="url(#puzzle1)" stroke="#1a6bff" stroke-width="1.5"/>
    <path d="M760,130 l65,0 l0,45 l-16,-5 l-16,5 l0,-16 l-33,0 z" fill="url(#puzzle2)" stroke="#ff6b35" stroke-width="1.5"/>
    <path d="M720,220 l70,0 l0,48 l-18,-6 l-17,6 l0,-18 l-35,0 z" fill="url(#puzzle1)" stroke="#1a6bff" stroke-width="1.5"/>
    <path d="M780,300 l60,0 l0,42 l-15,-5 l-15,5 l0,-15 l-30,0 z" fill="url(#puzzle2)" stroke="#ff6b35" stroke-width="1.5"/>
    <!-- Bottom-left cluster -->
    <path d="M60,270 l65,0 l0,45 l-16,-5 l-16,5 l0,-16 l-33,0 z" fill="url(#puzzle1)" stroke="#1a6bff" stroke-width="1.5"/>
    <path d="M150,330 l55,0 l0,38 l-14,-5 l-14,5 l0,-14 l-27,0 z" fill="url(#puzzle2)" stroke="#ff6b35" stroke-width="1.5"/>
    <path d="M420,310 l60,0 l0,42 l-15,-5 l-15,5 l0,-15 l-30,0 z" fill="url(#puzzle1)" stroke="#1a6bff" stroke-width="0.8" opacity="0.5"/>
  </g>
  
  <!-- Connecting lines (AI integration) -->
  <g opacity="0.2">
    <line x1="130" y1="335" x2="680" y2="75" stroke="#1a6bff" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="200" y1="355" x2="760" y2="150" stroke="#1a6bff" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="130" y1="335" x2="780" y2="320" stroke="#1a6bff" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
    <line x1="760" y1="150" x2="720" y2="240" stroke="#1a6bff" stroke-width="1" stroke-dasharray="6,4"/>
    <line x1="680" y1="75" x2="760" y2="150" stroke="#1a6bff" stroke-width="1" stroke-dasharray="6,4"/>
  </g>
  
  <!-- Badge -->
  <rect x="30" y="25" width="100" height="26" rx="13" fill="#1a6bff"/>
  <text x="80" y="42" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#fff">深度连载</text>
  
  <!-- Title -->
  <text x="50" y="170" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="46" font-weight="bold" fill="#1e293b">全过程咨询的</text>
  <text x="50" y="235" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="46" font-weight="bold" fill="#1e293b">碎片化困局</text>
  
  <rect x="50" y="252" width="60" height="3" rx="1.5" fill="#1a6bff"/>
  
  <!-- Brand -->
  <text x="910" y="370" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#94a3b8" opacity="0.7">清源智界 · 獴探</text>
</svg>
