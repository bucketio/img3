<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a6bff"/><stop offset="1" stop-color="#4a90d9"/></linearGradient>
  </defs>
  <rect width="700" height="240" fill="url(#cardBg)" rx="12"/>
  
  <!-- Decorative elements -->
  <circle cx="650" cy="30" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="50" cy="200" r="60" fill="#ffffff" opacity="0.05"/>
  <rect x="0" y="160" width="700" height="80" fill="#ffffff" opacity="0.05" rx="0"/>
  
  <!-- Label -->
  <rect x="30" y="20" width="80" height="26" rx="13" fill="#ffffff" opacity="0.2"/>
  <text x="70" y="37" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="bold" fill="#fff">下周预告</text>
  
  <!-- Title -->
  <text x="350" y="75" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="bold" fill="#fff">从3天到1小时</text>
  <text x="350" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#ffffff" opacity="0.9">獴探·智写 实战演示</text>
  
  <!-- Divider dot -->
  <circle cx="350" cy="130" r="3" fill="#fff" opacity="0.5"/>
  
  <!-- Date -->
  <text x="350" y="155" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#fff" opacity="0.85">8月24日 正式发布</text>
  
  <!-- Bottom tagline -->
  <text x="350" y="195" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#ffffff" opacity="0.7">一份污水处理厂可研报告，从打开软件到导出Word的全流程实测</text>
  
  <!-- Brand -->
  <text x="670" y="225" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#fff" opacity="0.5">清源智界 · 獴探</text>
</svg>
