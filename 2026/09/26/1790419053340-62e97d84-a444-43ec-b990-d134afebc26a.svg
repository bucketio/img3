<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"></stop>
      <stop offset="50%" stop-color="#1C2541"></stop>
      <stop offset="100%" stop-color="#0f172a"></stop>
    </linearGradient>

    <!-- Glowing Cyan for Magnetic Field -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"></stop>
      <stop offset="100%" stop-color="#00A8FF" stop-opacity="0.2"></stop>
    </linearGradient>

    <!-- Amber for Torque Vector -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB800"></stop>
      <stop offset="100%" stop-color="#FF5C00"></stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"></path>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#bgGradient)"></rect>
  <rect width="900" height="383" fill="url(#grid)"></rect>

  <!-- Abstract Motor Geometry (Right side) -->
  <g transform="translate(700, 191.5)">
    <!-- Outer Stator Boundary (Fixed Outer Diameter) -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#3A506B" stroke-width="2" stroke-dasharray="4 4"></circle>
    
    <!-- Thin Stator Yoke (The core geometric advantage) -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#5BC0BE" stroke-width="8" filter="url(#glow)" stroke-opacity="0.6"></circle>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#1C2541" stroke-width="15"></circle>

    <!-- Massive Air Gap Diameter (D) -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="#FFB800" stroke-width="3" stroke-dasharray="10 5" filter="url(#glow)"></circle>
    
    <!-- High Pole Count Representation (Rotor Poles) -->
    <g id="poles">
      <!-- Generate 36 poles algorithmically via rotations -->
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(0)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(10)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(20)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(30)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(40)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(50)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(60)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(70)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(80)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(90)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(100)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(110)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(120)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(130)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(140)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(150)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(160)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(170)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(180)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(190)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(200)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(210)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(220)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(230)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(240)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(250)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(260)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(270)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(280)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(290)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(300)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(310)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(320)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(330)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#00F0FF" stroke-width="4" transform="rotate(340)"></path>
      <path d="M 0 -130 L 0 -120" stroke="#FF5C00" stroke-width="4" transform="rotate(350)"></path>
    </g>

    <!-- Radius/Torque indicator Arrow -->
    <path d="M 0 0 L -100 -90" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8"></path>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"></circle>
    <polygon points="-100,-90 -95,-82 -90,-88" fill="#FFFFFF" transform="rotate(-40 -100 -90)"></polygon>
    <text x="-50" y="-30" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-style="italic" opacity="0.9">D/2 (力臂最大化)</text>
  </g>

  <!-- Formula Watermarks (Background Math) -->
  <g font-family="Georgia, serif" font-style="italic" font-size="32" fill="#FFFFFF" opacity="0.05">
    <text x="50" y="80">T ∝ D²L</text>
    <text x="350" y="300">n_m = 60 f_e / p</text>
    <text x="100" y="350">K_{mag} ∝ p</text>
    <text x="650" y="70">h_{yoke} ∝ 1/p</text>
  </g>

  <!-- Typography & Content (Left side) -->
  <g transform="translate(60, 0)">
    
    <!-- Tag -->
    <rect x="0" y="50" width="120" height="30" rx="4" fill="#1C2541" stroke="#5BC0BE" stroke-width="1"></rect>
    <text x="15" y="71" fill="#5BC0BE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="2">深度技术解析</text>

    <!-- Main Title -->
    <text x="0" y="140" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="1">
      为什么<tspan fill="#00F0FF">极数</tspan>越多，
    </text>
    <text x="0" y="200" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="1">
      <tspan fill="#FFB800">转矩</tspan>越大？
    </text>

    <!-- Subtitle -->
    <text x="0" y="250" fill="#8D99AE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="0.5">
      揭秘高极对数电机的底层物理机理与缩放定律
    </text>

    <!-- Key Concept Tags -->
    <g transform="translate(0, 290)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">
      <!-- Tag 1 -->
      <path d="M 0 10 L 10 0 L 120 0 L 120 20 L 10 20 Z" fill="#FF5C00" opacity="0.1"></path>
      <path d="M 0 10 L 10 0 L 120 0 L 120 20 L 10 20 Z" fill="none" stroke="#FF5C00" stroke-width="1"></path>
      <text x="25" y="15" fill="#FFB800">磁轭减薄效应</text>

      <!-- Tag 2 -->
      <g transform="translate(135, 0)">
        <path d="M 0 10 L 10 0 L 120 0 L 120 20 L 10 20 Z" fill="#00F0FF" opacity="0.1"></path>
        <path d="M 0 10 L 10 0 L 120 0 L 120 20 L 10 20 Z" fill="none" stroke="#00F0FF" stroke-width="1"></path>
        <text x="25" y="15" fill="#00F0FF">空间力臂重构</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(270, 0)">
        <path d="M 0 10 L 10 0 L 100 0 L 100 20 L 10 20 Z" fill="#FFFFFF" opacity="0.05"></path>
        <path d="M 0 10 L 10 0 L 100 0 L 100 20 L 10 20 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"></path>
        <text x="25" y="15" fill="#8D99AE">零背隙直驱</text>
      </g>
    </g>
  </g>

  <!-- Decorative technical lines -->
  <path d="M 0 380 L 900 380" stroke="#5BC0BE" stroke-width="2" opacity="0.5" stroke-dasharray="20 10 5 10"></path>
</svg>