<svg viewBox="0 0 680 260" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>牛鞭效应的四个成因</title>
<desc>需求预测修正、订货批量、促销与价格战、短缺博弈四个成因</desc>
<text x="40" y="38" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">四个成因：理性决策叠加，信号逐级失真</text>
<rect x="40" y="60" width="280" height="80" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="60" y="88" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">1 需求预测修正</text>
<text x="60" y="116" font-family="sans-serif" font-size="12" fill="#185FA5">用自己的订单预测，再叠加安全库存</text>
<rect x="360" y="60" width="280" height="80" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="380" y="88" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">2 订货批量</text>
<text x="380" y="116" font-family="sans-serif" font-size="12" fill="#185FA5">凑单、按周按月订，订单变成脉冲</text>
<rect x="40" y="160" width="280" height="80" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="60" y="188" font-family="sans-serif" font-size="14" font-weight="500" fill="#993C1D">3 促销与价格战</text>
<text x="60" y="216" font-family="sans-serif" font-size="12" fill="#993C1D">囤货透支需求，促销结束后断崖</text>
<rect x="360" y="160" width="280" height="80" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="380" y="188" font-family="sans-serif" font-size="14" font-weight="500" fill="#993C1D">4 短缺博弈</text>
<text x="380" y="216" font-family="sans-serif" font-size="12" fill="#993C1D">虚报订单抢配额，恢复后集体取消</text>
</svg>
